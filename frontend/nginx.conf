server {
    listen 80;
    server_name thehive.forum www.thehive.forum;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thehive.forum www.thehive.forum;

    ssl_certificate /etc/letsencrypt/live/thehive.forum/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thehive.forum/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://thehive:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://thehive:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
